name: Deploy

on:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: "npm i"
      - run: "npx tsc"

  test:
    runs-on: ubuntu-latest
    name: vitest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  lexicons:
    runs-on: ubuntu-latest
    name: lexicon
    env:
      LEAFLET_APP_PASSWORD: ${{ secrets.LEAFLET_APP_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: "npm i"
      - run: "npm run publish-lexicons"
  deploy-supabase:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    name: Deploy Supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PRODUCTION_PROJECT_ID: bdefzwcumgzjwllsnaej

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase link --project-ref $PRODUCTION_PROJECT_ID
      - run: supabase db push

  # Production introspection (catalog reads only) after the deploy: anything
  # that differs from the committed types is prod drift no migration explains
  # (dashboard edits, hand-run DDL).
  prod-schema-drift:
    needs: deploy-supabase
    runs-on: ubuntu-latest
    name: Prod schema matches committed types
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PRODUCTION_PROJECT_ID: bdefzwcumgzjwllsnaej
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: "npm i"
      - run: |
          export PROD_DB_URL=$(node -e 'console.log(`postgresql://postgres.${process.env.PRODUCTION_PROJECT_ID}:${encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)}@aws-0-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require`)')
          echo "::add-mask::$PROD_DB_URL"
          node scripts/generate-db-types.mjs --prod --check
